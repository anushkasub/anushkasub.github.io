---
layout: default
---
<article class="post">
  <p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
